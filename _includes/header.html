<header class="site-header">

  <div class="wrap">

    <div style="float:left; margin-top:10px; margin-right:10px;">
    <a href="{% if page.lang == 'it' %}{{ "/it/feed.xml" | prepend: site.baseurl }}{% else %}{{ "/feed.xml" | prepend: site.baseurl }}{% endif %}">
      <img src="/assets/rssicon.svg" width="40" alt="RSS">
    </a>
    </div>

    <a class="site-title" href="{{ site.baseurl }}{{ t.prefix }}/">{{ site.title }}</a>
    
    <nav class="site-nav">
      <button class="menu-icon" type="button" aria-label="{{ t.open_nav }}" aria-expanded="false" aria-controls="site-navigation">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 15" aria-hidden="true">
          <path fill="currentColor" d="M18 1.5c0 .82-.66 1.5-1.48 1.5H1.48A1.48 1.48 0 0 1 0 1.5C0 .67.66 0 1.48 0h15.04A1.48 1.48 0 0 1 18 1.5zm0 6c0 .82-.66 1.5-1.48 1.5H1.48A1.48 1.48 0 0 1 0 7.5C0 6.67.66 6 1.48 6h15.04A1.48 1.48 0 0 1 18 7.5zm0 6c0 .82-.66 1.5-1.48 1.5H1.48A1.48 1.48 0 0 1 0 13.5c0-.83.66-1.5 1.48-1.5h15.04A1.48 1.48 0 0 1 18 13.5z"/>
        </svg>
      </button>
      <div class="trigger" id="site-navigation">
        <a class="page-link" href="{{ site.baseurl }}{{ t.prefix }}/#work">{{ t.nav_work }}</a>
        <a class="page-link" href="{{ site.baseurl }}/projects/">Projects</a>
        <a class="page-link" href="{{ site.baseurl }}{{ t.prefix }}/#experience">{{ t.nav_experience }}</a>
        <a class="page-link" href="{{ site.baseurl }}{{ t.prefix }}/#projects">{{ t.nav_skills }}</a>
        <a class="page-link" href="{{ site.baseurl }}/about/">About</a>
        <a class="page-link" href="{{ site.baseurl }}/writing/">Writing</a>
        <a class="page-link" href="{{ site.baseurl }}{{ t.prefix }}/#contact">{{ t.nav_contact }}</a>
      </div>
      <a class="lang-switch" href="{% if page.alt %}{{ page.alt | prepend: site.baseurl }}{% elsif page.lang == 'it' %}{{ site.baseurl }}/{% else %}{{ site.baseurl }}/it/{% endif %}" hreflang="{% if page.lang == 'it' %}en{% else %}it{% endif %}" lang="{% if page.lang == 'it' %}en{% else %}it{% endif %}" title="{{ t.switch_title }}" aria-label="{{ t.switch_title }}">{{ t.switch_code }}</a>
      <button class="theme-toggle" type="button" aria-label="{{ t.to_dark }}" aria-pressed="false" title="{{ t.to_dark }}">
        <span aria-hidden="true">☾</span>
      </button>
    </nav>
  </div>
  <script>
    (function () {
      var themeRoot = document.documentElement;
      var themePalettes = {
        light: { page: '#f7f9fa', surface: '#ffffff', subtle: '#edf1f3', ink: '#17212a', muted: '#52616c', line: '#d5dee3', accent: '#435f73', deep: '#243746' },
        dark: { page: '#101820', surface: '#19242d', subtle: '#1c2a34', ink: '#edf1f2', muted: '#acbbc3', line: '#364954', accent: '#a4becc', deep: '#243746' }
      };
      function applyTheme(theme) {
        theme = theme === 'dark' ? 'dark' : 'light';
        themeRoot.dataset.theme = theme;
        themeRoot.style.colorScheme = theme;
        if (document.body) document.body.dataset.theme = theme;
        Object.keys(themePalettes[theme]).forEach(function (name) {
          themeRoot.style.setProperty('--' + name, themePalettes[theme][name]);
        });
      }
      applyTheme(themeRoot.dataset.theme);

      var menuToggle = document.querySelector('.menu-icon');
      var navigation = document.querySelector('#site-navigation');

      if (menuToggle && navigation) {
        menuToggle.addEventListener('click', function () {
          var isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
          menuToggle.setAttribute('aria-expanded', String(!isOpen));
          menuToggle.setAttribute('aria-label', isOpen ? {{ t.open_nav | jsonify }} : {{ t.close_nav | jsonify }});
          navigation.classList.toggle('is-open', !isOpen);
        });
        navigation.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () {
            menuToggle.setAttribute('aria-expanded', 'false');
            menuToggle.setAttribute('aria-label', {{ t.open_nav | jsonify }});
            navigation.classList.remove('is-open');
          });
        });
      }

      var themeToggle = document.querySelector('.theme-toggle');
      if (!themeToggle) return;
      var themeIcon = themeToggle.querySelector('span');

      function updateThemeButton() {
        var isDark = document.documentElement.dataset.theme === 'dark';
        var label = isDark ? {{ t.to_light | jsonify }} : {{ t.to_dark | jsonify }};
        themeToggle.setAttribute('aria-label', label);
        themeToggle.setAttribute('title', label);
        themeToggle.setAttribute('aria-pressed', String(isDark));
        if (themeIcon) themeIcon.textContent = isDark ? '☀' : '☾';
      }

      updateThemeButton();
      themeToggle.addEventListener('click', function () {
        var currentTheme = document.documentElement.dataset.theme;
        var nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
        try {
          localStorage.setItem('portfolio-theme', nextTheme);
        } catch (error) {
          // Theme switching still works if browser storage is unavailable.
        }
        updateThemeButton();
      });
    }());
  </script>

</header>
