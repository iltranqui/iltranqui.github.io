<header class="site-header">

  <div class="wrap">

    <div style="float:left; margin-top:10px; margin-right:10px;">
    <a href="{{ "/feed.xml" | prepend: site.baseurl }}">
      <img src="/assets/rssicon.svg" width="40">
    </a>
    </div>

    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
    
    <nav class="site-nav">
      <button class="menu-icon" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-navigation">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 15" aria-hidden="true">
          <path fill="currentColor" d="M18 1.5c0 .82-.66 1.5-1.48 1.5H1.48A1.48 1.48 0 0 1 0 1.5C0 .67.66 0 1.48 0h15.04A1.48 1.48 0 0 1 18 1.5zm0 6c0 .82-.66 1.5-1.48 1.5H1.48A1.48 1.48 0 0 1 0 7.5C0 6.67.66 6 1.48 6h15.04A1.48 1.48 0 0 1 18 7.5zm0 6c0 .82-.66 1.5-1.48 1.5H1.48A1.48 1.48 0 0 1 0 13.5c0-.83.66-1.5 1.48-1.5h15.04A1.48 1.48 0 0 1 18 13.5z"/>
        </svg>
      </button>
      <div class="trigger" id="site-navigation">
        <a class="page-link" href="{{ site.baseurl }}/#work">Work</a>
        <a class="page-link" href="{{ site.baseurl }}/#experience">Experience</a>
        <a class="page-link" href="{{ site.baseurl }}/#projects">Skills</a>
        <a class="page-link" href="{{ site.baseurl }}/about/">About</a>
        <a class="page-link" href="{{ site.baseurl }}/writing/">Writing</a>
        <a class="page-link" href="{{ site.baseurl }}/#contact">Contact</a>
      </div>
    </nav>
  </div>
  <script>
    (function () {
      var toggle = document.querySelector('.menu-icon');
      var navigation = document.querySelector('#site-navigation');
      if (!toggle || !navigation) return;
      toggle.addEventListener('click', function () {
        var isOpen = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!isOpen));
        toggle.setAttribute('aria-label', isOpen ? 'Open navigation' : 'Close navigation');
        navigation.classList.toggle('is-open', !isOpen);
      });
      navigation.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          toggle.setAttribute('aria-expanded', 'false');
          toggle.setAttribute('aria-label', 'Open navigation');
          navigation.classList.remove('is-open');
        });
      });
    }());
  </script>

</header>
